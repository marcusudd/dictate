[project]
name = "dictate"
version = "0.1.0"
description = "Push-to-talk dictation in Swedish and English, running locally on your own machine"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Marcus", email = "210091427+marcusudd@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.15.0",
    "pynput>=1.8.2",
    "qwen-asr>=0.0.6",
    "scipy>=1.14",
    "sounddevice>=0.5.6",
    "torch>=2.14",
    # tray app: rumps is PyObjC, everything else gets pystray
    "rumps>=0.4.0; sys_platform == 'darwin'",
    "pystray>=0.19.5; sys_platform != 'darwin'",
    "pillow>=10; sys_platform != 'darwin'",
]

[project.scripts]
dictate = "dictate.app:main"

# PyPI's Windows torch is CPU-only. Linux PyPI torch already bundles CUDA 13,
# so Windows gets the matching cu130 wheel from pytorch.org. Pascal (GTX 10xx)
# owners: change cu130 to cu126 in both places below, CUDA 13 dropped Pascal.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
