[project]
name = "dictate"
version = "0.1.0"
description = "Push-to-talk dictation into any Mac app, running R2T2 locally on MPS"
readme = "README.md"
authors = [
    { name = "Marcus", email = "210091427+marcusudd@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.15.0",
    "pynput>=1.8.2",
    "qwen-asr>=0.0.6",
    "rumps>=0.4.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
dictate = "dictate.menubar:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
